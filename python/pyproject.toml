[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vektorregelung"
version = "0.1.0"
description = "Indirect field-oriented control (Vektorregelung) of an induction motor"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vektorregelung contributors" }]
keywords = [
    "field-oriented-control",
    "foc",
    "vector-control",
    "induction-motor",
    "motor-control",
    "vektorregelung",
]

# The core library has no runtime dependencies; the example plot is optional.
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
